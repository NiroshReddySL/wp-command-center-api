[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wp-command-center-api"
version = "0.1.0"
requires-python = ">=3.12"
# Upper-bounded at the next major. Open bounds mean two builds of the same
# commit can install different code — the ruff lesson below, but landing in
# production instead of CI. APScheduler is pinned below 4 specifically: its
# 4.x line is a rewritten API, not a compatible upgrade.
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0",
    "asyncpg>=0.29.0,<1.0",
    "alembic>=1.13.3,<2.0",
    "pydantic-settings>=2.5.2,<3.0",
    "openai>=1.54.0,<3.0",
    "apscheduler>=3.10.4,<4.0",
    "httpx>=0.27.2,<1.0",
    "python-jose[cryptography]>=3.3.0,<4.0",
    "bcrypt>=4.2.0,<6.0",
    "python-multipart>=0.0.12,<1.0",
    "email-validator>=2.0.0,<3.0",
    "cryptography>=43.0.0,<47.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    # Bounded deliberately. Ruff ships new rules in minor releases, so an open
    # upper bound means CI can turn red on a day nobody committed anything.
    "ruff>=0.16.1,<0.17",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

# The rule set is declared, not inherited. Ruff's *default* selection is not a
# stable contract: 0.16 widened it and turned this CI red — 292 errors — on a
# commit that changed no Python at all. Listing the rules here means the gate
# only ever moves because someone moved it.
[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle — the subset the formatter doesn't own
    "F",               # pyflakes
    "I",               # import ordering
    "UP",              # pyupgrade — target-version is py312, so keep current
    "B",               # bugbear — genuine defect class
    "C4", "PIE", "FLY", "RUF",
]
ignore = [
    # Ambiguous-unicode. The en dash in "120–160 characters" and the × in
    # "1280×720" are correct typography inside strings that users read;
    # rewriting them to ASCII would degrade the copy this app renders. The
    # same characters read correctly in comments and docstrings, where this
    # codebase uses them throughout.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is *defined* as a call in the argument
# default. B008 is right about mutable defaults in general, and wrong about
# every route in this codebase.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header",
    "fastapi.Body", "fastapi.Form", "fastapi.File", "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
