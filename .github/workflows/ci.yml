name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check app/ tests/

      - name: Pytest
        run: python -m pytest tests/ -q
